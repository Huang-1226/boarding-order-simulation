<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登机策略模拟器 · Boarding Strategies Simulator</title>
<style>
  :root{ --walk:#2f7ed8; --stow:#d94b4b; --red:#d94b4b; --green:#1fa463; --blue:#1f6fb2; --amber:#e0a52e;
         --bg:#0b1622; --panel:#13233a; --line:#27405f; --ink:#e7eef7; --muted:#8fa6c0; }
  *{box-sizing:border-box}
  body{margin:0;background:#0b1622;color:var(--ink);font-family:"Microsoft YaHei",system-ui,Segoe UI,Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 50px}
  header{background:linear-gradient(135deg,#123357,#1f6fb2);border-radius:14px;padding:18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  header h1{margin:0;font-size:20px}
  header p{margin:6px 0 0;color:#d5e6f7;font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:16px}
  h2.sec{font-size:14px;margin:0 0 12px;color:#cfe2f5}
  .ctrl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  label{font-size:13px;color:#cddcec}
  input[type=number]{width:70px;padding:6px 8px;border:1px solid #3a5a80;border-radius:8px;background:#0f2440;color:#eaf2fb}
  input[type=range]{width:130px;vertical-align:middle}
  button{border:0;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;background:#1f6fb2;color:#fff}
  button.ghost{background:#173455;color:#cfe2f5;border:1px solid #31567f}
  button:hover{filter:brightness(1.1)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .sq{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:middle}
  canvas{width:100%;height:auto;display:block;background:#0a1420;border:1px solid var(--line);border-radius:12px;margin-top:4px}
  .tick{font-size:15px;color:#cfe2f5}.tick b{color:#7fd1a3}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{padding:9px 10px;font-size:13px;text-align:center;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:12px}
  td.name{text-align:left;font-weight:600}
  .cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .concl{margin-top:12px;padding:11px 14px;border-radius:10px;background:#12283f;border:1px solid #244a70;color:#cfe2f5;font-size:13.5px}
  .concl b{color:#7fd1a3}
  footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>登机策略模拟器</h1>
    <p>上方为俯视机舱动画（门在顶部），下方为平均用时统计。蓝=行走，红=放行李，亮座=已就座。</p>
  </header>

  <div class="panel">
    <div class="ctrl">
      <label>排数 R <input type="number" id="R" value="30" min="5" max="50"></label>
      <label>放行李 S <input type="number" id="S" value="3" min="1" max="10"></label>
      <label>统计次数 <input type="number" id="REP" value="20" min="1" max="200"></label>
      <label>速度 <input type="range" id="speed" min="1" max="30" value="12"></label>
      <button id="play">▶ 播放</button>
      <button class="ghost" id="step">单步</button>
      <button class="ghost" id="reset">重置</button>
      <span class="tick">tick: <b id="tick">0</b></span>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:#2f7ed8"></span>行走中</span>
      <span><span class="dot" style="background:#d94b4b"></span>正在放行李</span>
      <span><span class="sq" style="background:#3a6b52"></span>已坐入座位</span>
      <span>3 座 | 过道 | 3 座</span>
    </div>
  </div>

  <canvas id="cv"></canvas>

  <div class="panel">
    <h2 class="sec">平均用时统计（<span id="replbl">20</span> 次取平均 · 交错倒序为确定性，单次即准）</h2>
    <table>
      <thead><tr><th style="text-align:left">策略</th><th>平均时间 (tick)</th><th>相对随机</th><th>平均并行度</th><th>被堵次数</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="concl" id="concl"></div>
    <div style="margin-top:12px"><button class="ghost" id="csv">下载结果 CSV</button></div>
  </div>

  <footer>纯本地运行 · 与 research 中仿真/理论一致 · MIT License</footer>
</div>

<script>
/* ================= 策略 ================= */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function ordRandom(R,K){ const a=[]; for(let r=1;r<=R;r++) for(let k=0;k<K;k++) a.push(r); return shuffle(a); }
function ordBack(R,K){ const a=[]; for(let r=R;r>=1;r--) for(let k=0;k<K;k++) a.push(r); return a; }
function ordZones(R,K,nz){ const zs=Math.floor(R/nz),a=[]; for(let z=nz;z>=1;z--){ const lo=(z-1)*zs+1,hi=(z<nz)? z*zs : R,s=[]; for(let r=lo;r<=hi;r++) for(let k=0;k<K;k++) s.push(r); shuffle(s); for(const x of s) a.push(x);} return a; }
function ordInterleaveDesc(R,K,stride){ const a=[]; for(let off=0;off<stride;off++){ const rows=[]; for(let r=1+off;r<=R;r+=stride) rows.push(r); rows.reverse(); for(const r of rows) for(let k=0;k<K;k++) a.push(r);} return a; }

const K = 6;
const STRATS = [
  {name:'随机 Random',   gen:(R)=>ordRandom(R,K),           color:'#d94b4b'},
  {name:'从后往前 Back', gen:(R)=>ordBack(R,K),             color:'#e0a52e'},
  {name:'分 5 区 Zones', gen:(R)=>ordZones(R,K,5),          color:'#b07fe0'},
  {name:'交错倒序 Interleaved', gen:(R)=>ordInterleaveDesc(R,K,6), color:'#7fd1a3'}
];

/* ================= 统计用仿真（返回用时/并行度/堵塞） ================= */
function simulate(order, R, STOW){
  const n=order.length, aisle=new Array(R+3).fill(null), target=order.slice();
  let nextp=0, seated=0, t=0, sumConc=0, totalBlocked=0; const stowLeft=new Map();
  while(seated<n){ t++;
    if(nextp<n && aisle[1]===null){ aisle[1]=nextp; nextp++; }
    let blocked=0;
    for(let pos=R; pos>=1; pos--){ const p=aisle[pos]; if(p===null||stowLeft.has(p)) continue;
      if(target[p]===pos){ stowLeft.set(p,STOW); continue; }
      if(aisle[pos+1]===null){ aisle[pos]=null; aisle[pos+1]=p; } else blocked++; }
    const done=[]; for(const [p,v] of stowLeft){ const nv=v-1; if(nv<=0)done.push(p); else stowLeft.set(p,nv); }
    for(const p of done){ for(let pos=1;pos<=R;pos++){ if(aisle[pos]===p){aisle[pos]=null;break;} } stowLeft.delete(p); seated++; }
    sumConc+=stowLeft.size; totalBlocked+=blocked;
  }
  return {time:t, conc:sumConc/t, blocked:totalBlocked};
}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;

/* ================= 动画用（带座位） ================= */
class Lane {
  constructor(name,color){ this.name=name; this.color=color; }
  reset(order,R,S){ this.R=R; this.S=S; this.n=order.length; this.target=order.slice();
    this.aisle=new Array(R+3).fill(-1); this.stowing=new Array(this.n).fill(false); this.left=new Array(this.n).fill(0);
    this.seats=[]; for(let r=0;r<=R;r++) this.seats.push(new Array(6).fill(-1));
    this.nextp=0; this.seated=0; this.t=0; this.done=false; this.finish=null; }
  step(){ if(this.done) return;
    const R=this.R,S=this.S,a=this.aisle,tg=this.target; this.t++;
    if(this.nextp<this.n && a[1]===-1){ a[1]=this.nextp; this.nextp++; }
    for(let pos=R;pos>=1;pos--){ const p=a[pos]; if(p===-1||this.stowing[p]) continue;
      if(tg[p]===pos){ this.stowing[p]=true; this.left[p]=S; continue; }
      if(a[pos+1]===-1){ a[pos]=-1; a[pos+1]=p; } }
    for(let p=0;p<this.n;p++){ if(this.stowing[p]){ this.left[p]--;
      if(this.left[p]<=0){ this.stowing[p]=false; const r=tg[p];
        for(let pos=1;pos<=R;pos++){ if(a[pos]===p){ a[pos]=-1; break; } }
        for(let si=0;si<6;si++){ if(this.seats[r][si]===-1){ this.seats[r][si]=p; break; } }
        this.seated++; } } }
    if(this.seated===this.n){ this.done=true; this.finish=this.t; } }
}

/* ================= 状态 ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let lanes=[], R=30, S=3, REP=20, timer=null;

function readParams(){
  R=Math.max(5,Math.min(50,+document.getElementById('R').value||30));
  S=Math.max(1,Math.min(10,+document.getElementById('S').value||3));
  REP=Math.max(1,Math.min(200,+document.getElementById('REP').value||20));
}

function setup(){
  readParams();
  lanes=STRATS.map(st=>{ const L=new Lane(st.name, st.color); L.reset(st.gen(R), R, S); return L; });
  document.getElementById('replbl').textContent=REP;
  stats(); draw(); document.getElementById('tick').textContent='0';
}

function stats(){
  const rows=STRATS.map(st=>{
    const res=[]; const det = st.name.indexOf('交错')>=0 || st.name.indexOf('Back')>=0;
    const nrun = det ? 1 : REP;
    for(let i=0;i<nrun;i++) res.push(simulate(st.gen(R),R,S));
    return {name:st.name, color:st.color, time:mean(res.map(r=>r.time)), conc:mean(res.map(r=>r.conc)), blocked:mean(res.map(r=>r.blocked))};
  });
  lastRows=rows;
  const base=rows[0].time;
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  rows.forEach(d=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="name"><span class="cdot" style="background:${d.color}"></span>${d.name}</td>
      <td>${d.time.toFixed(1)}</td><td>${(d.time/base*100).toFixed(0)}%</td>
      <td>${d.conc.toFixed(2)}</td><td>${d.blocked.toFixed(0)}</td>`;
    tb.appendChild(tr);
  });
  const fastest=rows.reduce((a,b)=>a.time<b.time?a:b);
  document.getElementById('concl').innerHTML=`最快：<b>${fastest.name}</b>（平均 ${fastest.time.toFixed(1)} tick），比"随机"快约 <b>${(((base-fastest.time)/base)*100).toFixed(0)}%</b>。`;
}
let lastRows=null;

/* ================= 渲染动画 ================= */
function draw(){
  const dpr=window.devicePixelRatio||1;
  const seatW=7, seatH=9, aisleW=14, rowH=13, cabGap=54, leftM=20, topM=44, bottomM=26;
  const cabW=6*seatW+aisleW;
  const W=leftM + lanes.length*cabW + (lanes.length-1)*cabGap + leftM;
  const H=topM + R*rowH + bottomM;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.maxWidth=W+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);

  lanes.forEach((L,li)=>{
    const cabX=leftM+li*(cabW+cabGap), aisleX=cabX+3*seatW;
    ctx.fillStyle=L.color; ctx.font='bold 12px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
    ctx.fillText(L.name, cabX+cabW/2, 18); ctx.textAlign='left';
    ctx.fillStyle='#375a82'; ctx.fillRect(aisleX, topM-8, aisleW, 6);
    ctx.fillStyle='#9fc0e3'; ctx.font='9px sans-serif'; ctx.fillText('门 door', aisleX-2, topM-12);
    ctx.fillStyle='#12233a'; ctx.strokeStyle='#233b58'; ctx.fillRect(aisleX, topM, aisleW, R*rowH); ctx.strokeRect(aisleX+.5, topM+.5, aisleW-1, R*rowH-1);
    for(let r=1;r<=R;r++){
      const y=topM+(r-1)*rowH;
      for(let si=0;si<6;si++){
        const x = si<3 ? cabX+si*seatW : aisleX+aisleW+(si-3)*seatW;
        const occ=L.seats[r][si]!==-1;
        ctx.fillStyle = occ ? L.color : '#1b2f47'; ctx.globalAlpha = occ?0.55:1;
        ctx.fillRect(x,y+1.5,seatW-1,rowH-3); ctx.globalAlpha=1;
        ctx.strokeStyle='#20344c'; ctx.strokeRect(x+.5,y+2,seatW-2,rowH-4);
      }
      const p=L.aisle[r];
      if(p!==-1){ const cx=aisleX+aisleW/2, cy=y+rowH/2, rad=Math.min(5,rowH/2-1.5);
        ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fillStyle=L.stowing[p]?'#d94b4b':'#2f7ed8'; ctx.fill(); }
    }
    ctx.fillStyle=L.done?'#7fd1a3':'#8fa6c0'; ctx.font='11px monospace';
    ctx.fillText(L.done?('✓ T='+L.finish):('seated '+L.seated+'/'+L.n), cabX, topM+R*rowH+18);
  });
  ctx.fillStyle='#4d6787'; ctx.font='10px monospace';
  for(let r=1;r<=R;r+=5){ ctx.fillText(r, leftM-10, topM+(r-1)*rowH+rowH/2+3); }
}

/* ================= 控制 ================= */
function tickAll(){
  let allDone=true;
  lanes.forEach(L=>{ if(!L.done) L.step(); if(!L.done) allDone=false; });
  document.getElementById('tick').textContent = lanes.length? Math.max(...lanes.map(l=>l.t)) : 0;
  draw(); if(allDone) pause();
}
function play(){ if(timer) return; timer=setInterval(tickAll, Math.max(8,220-7*(+document.getElementById('speed').value))); document.getElementById('play').textContent='⏸ 暂停'; }
function pause(){ if(timer){ clearInterval(timer); timer=null; } document.getElementById('play').textContent='▶ 播放'; }
document.getElementById('play').onclick=()=>{ timer?pause():play(); };
document.getElementById('step').onclick=()=>{ pause(); tickAll(); };
document.getElementById('reset').onclick=()=>{ pause(); setup(); };
document.getElementById('R').onchange=()=>{ pause(); setup(); };
document.getElementById('S').onchange=()=>{ pause(); setup(); };
document.getElementById('REP').onchange=()=>{ pause(); setup(); };
document.getElementById('csv').onclick=()=>{
  if(!lastRows){ return; }
  let csv='strategy,R,stow,repeats,avg_time,rel_random,avg_concurrent,total_blocked\n';
  const base=lastRows[0].time;
  lastRows.forEach(d=>{ csv+=`${d.name},${R},${S},${REP},${d.time.toFixed(1)},${(d.time/base).toFixed(3)},${d.conc.toFixed(2)},${d.blocked.toFixed(0)}\n`; });
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`boarding_R${R}_S${S}.csv`; a.click(); URL.revokeObjectURL(a.href);
};

setup();
</script>
</body>
</html>
